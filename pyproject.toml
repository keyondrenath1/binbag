[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binbag"
version = "0.4.0"
description = "Find and bin junk mail in any IMAP mailbox, from the terminal. Dry run by default."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["email", "imap", "inbox", "cleanup", "unsubscribe", "gmail", "icloud", "outlook", "hotmail", "oauth2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
binbag = "binbag.cli:main"

[project.urls]
Homepage = "https://github.com/keyondrenath1/binbag"
Issues = "https://github.com/keyondrenath1/binbag/issues"

[tool.setuptools.package-data]
binbag = ["*.html"]

[tool.setuptools.packages.find]
include = ["binbag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
